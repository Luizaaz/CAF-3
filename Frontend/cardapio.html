<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardápio | The Royal Garden Café</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         CABEÇALHO
    ========================================== -->

    <header class="header">

        <div class="logo-circle">
            RG
        </div>

        <h1>
            THE ROYAL GARDEN CAFÉ
        </h1>

        <p class="subtitulo">
            Uma experiência digna da realeza
        </p>

        <nav>

            <a href="index.html">
                Início
            </a>

            <a href="cardapio.html" class="ativo">
                Cardápio
            </a>

            <a href="historia.html">
                Nossa História
            </a>

            <a href="contato.html">
                Contato
            </a>

            <a href="admin.html">
                Administração
            </a>

        </nav>

    </header>


    <!-- =========================================
         CARDÁPIO
    ========================================== -->

    <main class="pagina">

        <div class="titulo-pagina">

            <span>❦</span>

            <h2>
                Nosso Cardápio
            </h2>

            <span>❦</span>

        </div>


        <p class="descricao-pagina">
            Delícias preparadas especialmente para você.
        </p>


        <!-- =====================================
             BOTÃO DO PEDIDO
        ====================================== -->

        <div class="pedido-topo">

            <button
                id="abrirPedido"
                class="botao-pedido"
                type="button">

                🛍️ Meu pedido

                <span id="contadorPedido">
                    0
                </span>

            </button>

        </div>


        <!-- =====================================
             BUSCA
        ====================================== -->

        <input
            type="search"
            id="busca"
            class="busca"
            placeholder="Buscar no cardápio..."
        >


        <!-- =====================================
             MENSAGEM
        ====================================== -->

        <p
            id="msg"
            class="mensagem">

            Carregando cardápio...

        </p>


        <!-- =====================================
             PRODUTOS
        ====================================== -->

        <div
            id="produtos"
            class="produtos">
        </div>


    </main>


    <!-- =========================================
         PAINEL DO PEDIDO
    ========================================== -->

    <section
        id="areaPedido"
        class="area-pedido">


        <div class="pedido-cabecalho">

            <h2>
                ❦ Meu pedido
            </h2>


            <button
                id="fecharPedido"
                class="fechar-pedido"
                type="button">

                ×

            </button>

        </div>


        <!-- ITENS -->

        <div
            id="itensPedido"
            class="itens-pedido">

        </div>


        <!-- TOTAL -->

        <div class="pedido-total">

            <span>
                Total
            </span>

            <strong id="totalPedido">
                R$ 0,00
            </strong>

        </div>


        <!-- AÇÕES -->

        <div class="pedido-acoes">

            <button
                id="limparPedido"
                class="botao-limpar"
                type="button">

                Limpar pedido

            </button>


            <button
                id="finalizarPedido"
                class="botao-finalizar"
                type="button">

                Finalizar pedido

            </button>

        </div>


    </section>


    <!-- =========================================
         RODAPÉ
    ========================================== -->

    <footer>

        © 2026 The Royal Garden Café

    </footer>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
