<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Administração</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:900px;margin:40px auto;padding:20px}.form{background:white;padding:25px;border-radius:12px}.form input,.form textarea{width:100%;padding:12px;margin:7px 0}.btn{padding:11px 18px;background:#3f486f;color:white;border:0;border-radius:6px;cursor:pointer}.item{background:white;margin:12px 0;padding:15px;display:flex;gap:15px;align-items:center;border-radius:10px}.item img{width:90px;height:65px;object-fit:cover}.del{background:#9d3e3e}</style></head><body><header><div class="rg">RG</div><h1>ADMINISTRAÇÃO</h1><p>The Royal Garden Café</p><nav><a href="/">Voltar ao cardápio</a></nav></header><main class="admin"><div class="form"><h2>Adicionar produto</h2><form id="f"><input id="nome" placeholder="Nome" required><input id="preco" type="number" step=".01" placeholder="Preço" required><input id="imagem_url" placeholder="URL da imagem" required><textarea id="descricao" placeholder="Descrição"></textarea><button class="btn">Adicionar ao banco</button></form></div><div id="lista"></div></main><script>
const f=document.getElementById("f"),lista=document.getElementById("lista");async function load(){let r=await fetch("/api/produtos"),p=await r.json();lista.innerHTML=p.map(x=>`<div class="item"><img src="${x.imagem_url}"><div><b>${x.nome}</b><br>R$ ${Number(x.preco).toFixed(2).replace(".",",")}<br>${x.descricao||""}</div><button class="btn del" onclick="del(${x.id})">Excluir</button></div>`).join("")}f.onsubmit=async e=>{e.preventDefault();await fetch("/api/produtos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome:nome.value,preco:preco.value,imagem_url:imagem_url.value,descricao:descricao.value})});f.reset();load()};async function del(id){if(confirm("Excluir?")){await fetch("/api/produtos/"+id,{method:"DELETE"});load()}}load();
</script></body></html>
